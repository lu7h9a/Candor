[package]
name = "candor-gui"
description = "Candor desktop client (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37.0"
egui_extras = "0.37.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
candor-core = { version = "0.0.1", path = "../candor-core" }
candor-proto = { version = "0.0.1", path = "../candor-proto" }

[dev-dependencies]
egui = "0.37.0"
egui_kittest = "0.37.0"
crossbeam-channel = "0.5.17"
serde_json = "1.0.154"
