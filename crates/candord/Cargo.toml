[package]
name = "candord"
description = "Candor root daemon: eBPF collector, /proc sampler, detection, socket server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
libbpf-rs = "0.27.2"
procfs = { version = "0.18.0", default-features = false }
rustix = { version = "1.1.6", features = ["time", "process", "net", "fs", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
candor-core = { version = "0.0.1", path = "../candor-core" }
candor-proto = { version = "0.0.1", path = "../candor-proto" }
thiserror = "2.0.21"
toml = "1.2.1"

[build-dependencies]
cc = "1.11.1"
libbpf-cargo = "0.27.2"
