[package]
name = "sysscoped"
description = "SysScope root daemon: eBPF collector, /proc sampler, detection, socket server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
libbpf-rs = "0.27.2"
procfs = { version = "0.18.0", default-features = false }
rustix = { version = "1.1.6", features = ["time", "process"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
sysscope-core = { version = "0.0.1", path = "../sysscope-core" }
sysscope-proto = { version = "0.0.1", path = "../sysscope-proto" }
thiserror = "2.0.21"

[build-dependencies]
cc = "1.11.1"
libbpf-cargo = "0.27.2"
