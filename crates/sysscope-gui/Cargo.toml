[package]
name = "sysscope-gui"
description = "SysScope desktop client (egui)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37.0"
egui_extras = "0.37.0"
egui_plot = "0.38.0"
png = "0.18.1"
serde_json = "1.0.154"
sysscope-core = { version = "0.0.1", path = "../sysscope-core" }
sysscope-proto = { version = "0.0.1", path = "../sysscope-proto" }

[dev-dependencies]
egui_kittest = "0.37.0"
