# systemd-sysusers definitions for SysScope (plan WP23/WP30).
# sysscope: may use the daemon socket. sysscope-act: may use act mode.
# sysscope-box: runs Glasshouse samples; no home, no shell, no extra groups.
g sysscope -
g sysscope-act -
u sysscope-box - "SysScope Glasshouse sandbox" / /usr/sbin/nologin
