# /etc/candor/rules.toml - local overrides of Candor's detection rules.
# The defaults are built into candord and are updated with the package;
# anything set here is merged on top of them, key by key. Restart the
# daemon after a change: sudo systemctl restart candord
#
# Example: switch off a rule, or change one threshold.
# [rules.R006]
# disabled = true
#
# [rules.R005]
# window_s = 20
