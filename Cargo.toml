[workspace]
resolver = "3"
members = [
    "crates/sysscope-proto",
    "crates/sysscope-core",
    "crates/sysscoped",
    "crates/sysscope-cli",
    "crates/sysscope-gui",
    "crates/sysscope-glasshouse",
    "crates/sysscope-itest",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/lu7h9a/sysscope"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"

[profile.release]
debug = 1

# Dependencies (egui's text layout above all) are optimised even in dev and
# test builds, so debug GUI frames are representative; our own crates stay
# unoptimised for debugging. Measured: 2000-process frames 25-50 ms -> see
# PROGRESS.md WP21.
[profile.dev.package."*"]
opt-level = 2
